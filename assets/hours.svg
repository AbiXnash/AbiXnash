<svg xmlns="http://www.w3.org/2000/svg" width="560" height="232" viewBox="0 0 560 232" role="img" aria-label="Bar chart titled where my hours go. Configuring neovim: almost all. Tweaking the Sofle keymap: a lot. Explaining what a split keyboard is: a lot. Writing actual code: barely any.">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1d1d1f; }
    .muted { fill: #6e6e73; }
    .track { fill: #e8e8ed; }
    .bar { fill: #0071e3; }
    .low { fill: #ff3b30; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f5f5f7; }
      .muted { fill: #86868b; }
      .track { fill: #2c2c2e; }
      .bar { fill: #2997ff; }
      .low { fill: #ff453a; }
    }
  </style>
  <text x="0" y="22" font-size="17" font-weight="700">where my hours go</text>
  <text x="0" y="42" font-size="12" class="muted">a scientific study</text>

  <text x="0" y="78" font-size="13">configuring neovim</text>
  <rect class="track" x="0" y="86" width="560" height="10" rx="5"/>
  <rect class="bar" x="0" y="86" width="532" height="10" rx="5"/>

  <text x="0" y="118" font-size="13">tweaking the sofle keymap</text>
  <rect class="track" x="0" y="126" width="560" height="10" rx="5"/>
  <rect class="bar" x="0" y="126" width="392" height="10" rx="5"/>

  <text x="0" y="158" font-size="13">explaining what a split keyboard is</text>
  <rect class="track" x="0" y="166" width="560" height="10" rx="5"/>
  <rect class="bar" x="0" y="166" width="300" height="10" rx="5"/>

  <text x="0" y="198" font-size="13">writing actual code</text>
  <rect class="track" x="0" y="206" width="560" height="10" rx="5"/>
  <rect class="low" x="0" y="206" width="22" height="10" rx="5"/>

  <text x="560" y="230" font-size="10" class="muted" text-anchor="end">source: trust me</text>
</svg>
